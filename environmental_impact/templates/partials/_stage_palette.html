{% comment %}Life-cycle stage colours: ITU-T L.1410 Fig. 14a hues (A red, B yellow, C blue, D dark red,
credit below zero green), softened to pastels; the outline keeps each bar visible on white.{% endcomment %}
<style>
  .dh-impact{--st-a:#f2b8b5;--st-a-line:#d98580;--st-b:#f6e19c;--st-b-line:#d6b95a;
    --st-c:#aecbee;--st-c2:#d3e3f7;--st-c-line:#7199cf;--st-d:#dcb4b4;--st-d-line:#b07878;
    --st-credit:#c7e3a3;--st-credit-line:#8fb85c}
  .dh-impact .fill.st-manufacture{background:var(--st-a);box-shadow:inset 0 0 0 1px var(--st-a-line)}
  .dh-impact .fill.st-transport,.dh-impact .fill.st-refurbish{background:var(--st-b);box-shadow:inset 0 0 0 1px var(--st-b-line)}
  .dh-impact .fill.st-use1{background:var(--st-c);box-shadow:inset 0 0 0 1px var(--st-c-line)}
  .dh-impact .fill.st-use2{background:var(--st-c2);box-shadow:inset 0 0 0 1px var(--st-c-line)}
  .dh-impact .fill.st-end_of_life{background:var(--st-d);box-shadow:inset 0 0 0 1px var(--st-d-line)}
  .dh-impact .fill.st-credit{background:var(--st-credit);box-shadow:inset 0 0 0 1px var(--st-credit-line)}
  .dh-impact .st-letter{display:block;font-size:.68rem;color:var(--bs-secondary-color,#6c757d)}
</style>
